server {
    # The listen port is substituted by nginx's envsubst-on-templates
    # entrypoint at startup (default 80, see the Dockerfile). $uri/$host below
    # survive it — envsubst only replaces variables that exist in the
    # environment. Note it rewrites comments too, so this file avoids spelling
    # out the substituted variable names.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API, reverse-proxied so the SPA can call it same-origin. The
    # browser then always talks to whatever address it loaded the page from —
    # LAN IP, mDNS name, VPN, reverse proxy — so no CORS is involved and the
    # backend port need not be published at all.
    location /api/ {
        # Docker's embedded DNS, re-resolved periodically: going through a
        # variable defers resolution to request time, so recreating the backend
        # container (new IP) doesn't strand nginx on a stale address.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream ${API_UPSTREAM};

        # No rewrite here: this API already serves everything under /api, and a
        # proxy_pass without a URI part forwards the request URI unchanged.
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # sumi-fonts.css keeps a fixed name across builds (see sumi-ui's README,
    # step 6) so it can't rely on content hashing to bust the cache; this
    # exact-match location revalidates it instead of caching it for a year.
    # Harmless while no other rule caches .css for a year yet — kept for
    # parity with the other Sumi UI apps.
    location = /sumi-fonts.css {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA deep-link fallback: unknown paths serve index.html, which is what
    # makes a reload on a sub-route work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
