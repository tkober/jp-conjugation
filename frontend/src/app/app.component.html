<sumi-app-shell [brand]="brand" [nav]="navItems">
  <sumi-app-switcher sumiShellSwitcher />

  @if (api.profile(); as profile) {
    <div sumiShellActions class="profile-pill">
      <sumi-badge tone="accent" title="Level and Elo">Lv {{ profile.level }} · {{ profile.elo | number: '1.0-0' }}</sumi-badge>
      <sumi-badge tone="neutral" title="Current streak">{{ profile.current_streak }} streak</sumi-badge>
      <span class="level-progress" [attr.aria-label]="'Progress to level ' + (profile.level + 1)">
        <span [style.width.%]="profile.level_progress * 100"></span>
      </span>
    </div>
  }

  <router-outlet />
  <sumi-hotkey-help />
</sumi-app-shell>
