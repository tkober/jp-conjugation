<section class="card">
  <h2>Elo</h2>
  <p class="hint">
    Your rating over the last {{ history().length }} answers — currently
    {{ elo() | number: '1.0-0' }}, level {{ level() }}.
  </p>
  @if (spark(); as line) {
    <svg class="spark" [attr.viewBox]="'0 0 ' + line.width + ' ' + line.height"
         preserveAspectRatio="none" role="img"
         [attr.aria-label]="'Elo from ' + line.min + ' to ' + line.max">
      <polyline [attr.points]="line.points" />
    </svg>
    <div class="spark-scale">
      <span>{{ line.min }}</span>
      <span>{{ line.max }}</span>
    </div>
  }
</section>
