<section class="tiles">
  <div class="tile">
    <span>Answered</span>
    <b>{{ attempts() }}</b>
  </div>
  <div class="tile">
    <span>Accuracy</span>
    <b>{{ accuracy() === null ? '—' : (accuracy() | percent: '1.0-0') }}</b>
  </div>
  <div class="tile">
    <span>Ø time</span>
    <b>{{ avgSeconds() === null ? '—' : (avgSeconds() | number: '1.1-1') + ' s' }}</b>
  </div>
  <div class="tile">
    <span>Best streak</span>
    <b>{{ bestStreak() }}</b>
  </div>
</section>
