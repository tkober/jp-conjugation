<sumi-page width="narrow" [inkEnd]="false">
@switch (phase()) {
  @case ('idle') {
    @if (loadFailed()) {
      <sumi-error-state title="Can't reach the server" companion="tanuki">
        Your progress is safe. Check the connection and try again.
        <button sumiErrorAction type="button" sumiButton variant="secondary" (click)="start()">
          Try again
        </button>
      </sumi-error-state>
    } @else {
      <sumi-session-gate
        title="Ready to practice?"
        text="Conjugate the word into the form you are asked for. Type the reading — it turns into kana as you go."
        actionLabel="Start session"
        companion="tanuki"
        (start)="start()"
      />
    }
  }

  @case ('ended') {
    <!-- No title: sumi-session-summary supplies its own heading. -->
    <sumi-session-gate [showAction]="false" companion="tanuki" (start)="start()">
      <sumi-session-summary
        [answered]="answered()"
        [correct]="correct()"
        [durationMs]="sessionDurationMs()"
        [delta]="eloDelta()"
        deltaLabel="Elo"
        [levelUp]="levelUp()"
        (restart)="start()"
      >
        <sumi-hanko sumiSummaryArt [characters]="hankoCharacters()" [label]="hankoLabel()" />
      </sumi-session-summary>
    </sumi-session-gate>
  }

  @default {
    @if (exercise(); as ex) {
      <!-- Lives in the shell's focus-mode header, not here — see
           *sumiShellFocusActions's doc comment. -->
      <sumi-session-bar *sumiShellFocusActions [answered]="answered()" [correct]="correct()" (end)="end()" />

      <div class="round" sumiFocusMode>
        <app-practice-round
          [exercise]="ex"
          [result]="result()"
          [gaveUp]="gaveUp()"
          (submitted)="onSubmitted($event)"
          (gaveUpRequested)="onGaveUpRequested($event)"
          (next)="onNext()"
        />
      </div>
    }
  }
}
</sumi-page>
