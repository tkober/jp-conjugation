<sumi-card>
  <div sumiCardHeader>
    <h2>Vocabulary</h2>
    <p class="hint">Which JLPT levels words are drawn from.</p>
  </div>
  <div class="options">
    @for (level of settings().jlpt_levels; track level) {
      <sumi-toggle
        [value]="!disabledJlpt().has(level)"
        [canChange]="canDisable(level)"
        (valueChange)="toggleLevel(level, $event)"
      >
        {{ level.toUpperCase() }}
      </sumi-toggle>
    }
  </div>
  @if (noLevelsLeft()) {
    <p class="warn">At least one level has to stay on.</p>
  }
</sumi-card>
