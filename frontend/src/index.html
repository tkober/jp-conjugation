<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conjugation Trainer</title>
  <base href="/">
  <!-- interactive-widget: the on-screen keyboard has to shrink the *layout*
       viewport, not only the visual one. With the default (resizes-visual) the
       page keeps its full height behind the keyboard, the browser scrolls the
       focused input into view, and the sticky header disappears above the
       visible strip — the app looked like it had jumped on every tap into the
       answer field. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <!-- Same mark as the shell's brand: 活 on the accent. Inline SVG, so there is
       no asset to ship and nothing to keep in sync. The fill is the beni
       accent preset's light value (#c62828, see sumi-ui's core/accent.ts) —
       it follows the beni accent provideSumi() is given in app.config.ts
       (#41, the app's original red), so update it by hand if that accent
       ever changes. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c62828%22/><text x=%2250%22 y=%2274%22 font-size=%2266%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22system-ui,sans-serif%22>活</text></svg>">
  <!-- Sumi UI's font-face rules, loaded as their own non-blocking stylesheet
       (not injected into styles.scss) — see sumi-ui's README, "Using Sumi UI
       in an app", step 6. -->
  <link rel="stylesheet" href="sumi-fonts.css">
</head>
<body>
  <app-root></app-root>
</body>
</html>
